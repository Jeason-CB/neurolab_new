services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neurolab
      POSTGRES_USER: neurolab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurolab_local_only}
    ports: ["5432:5432"]
    volumes: ["neurolab_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurolab -d neurolab"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  neurolab_pgdata:
